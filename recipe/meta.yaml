{% set name = "robot_descriptions" %}
{% set version = "3.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/robot_descriptions-{{ version }}.tar.gz
  sha256: 4abf4b0dc34694fd5229b10c631d4b50e872dc7a9ca6a72bc2e30ed69c17e81e

build:
  entry_points:
    - robot_descriptions = robot_descriptions.__main__:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit
    - pip
  run:
    - python >={{ python_min }}
    - git
    - gitpython >=3.1.18
    - tqdm >=4.64.0

test:
  imports:
    - robot_descriptions
  commands:
    - pip check
    - robot_descriptions --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/robot-descriptions/robot_descriptions.py
  summary: Import open source robot description as Python modules.
  license: Apache-2.0
  license_file:
    - NOTICE
    - LICENSE

extra:
  recipe-maintainers:
    - GiulioRomualdi
    - stephane-caron
